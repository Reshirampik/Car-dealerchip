                  type: VARCHAR(50)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: car_model_required_components
            columnNames: car_model_id, component_type
            constraintName: pk_car_model_required_components
        - addForeignKeyConstraint:
            baseTableName: car_model_required_components
            baseColumnNames: car_model_id
            referencedTableName: car_models
            referencedColumnNames: id
            constraintName: fk_car_model_required_components_model

