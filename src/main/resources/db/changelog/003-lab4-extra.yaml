
databaseChangeLog:
  - changeSet:
      id: 003-create-assembly-orders
      changes:
        - createTable:
            tableName: assembly_orders
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: removed
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: source_order_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: source_order_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: car_id
                  type: UUID
              - column:
                  name: model_id
                  type: UUID
              - column:
                  name: required_component_ids
                  type: TEXT
              - column:
                  name: warehouse_employee_id
                  type: UUID
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

