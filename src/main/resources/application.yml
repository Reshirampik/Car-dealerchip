spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8081/realms/dealership}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

app:
  rabbitmq:
    exchange: ${APP_RABBITMQ_EXCHANGE:dealership.exchange}
    order-sent-routing-key: ${APP_RABBITMQ_ORDER_SENT_ROUTING_KEY:order.sent-for-approval}
    order-approved-routing-key: ${APP_RABBITMQ_ORDER_APPROVED_ROUTING_KEY:order.approved}
    order-rejected-routing-key: ${APP_RABBITMQ_ORDER_REJECTED_ROUTING_KEY:order.rejected}
    queues:
      order-sent: ${APP_RABBITMQ_QUEUE_ORDER_SENT:dealership.order.sent}
      order-approved: ${APP_RABBITMQ_QUEUE_ORDER_APPROVED:dealership.order.approved}
      order-rejected: ${APP_RABBITMQ_QUEUE_ORDER_REJECTED:dealership.order.rejected}
  outbox:
    publish-interval-ms: ${APP_OUTBOX_PUBLISH_INTERVAL_MS:5000}
  grpc:
    storage-target: ${APP_GRPC_STORAGE_TARGET:localhost:9090}
    timeout-ms: ${APP_GRPC_TIMEOUT_MS:2000}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}