services:
  order-db:
    image: postgres:15-alpine
    container_name: dealership-order-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dealership_order
      POSTGRES_USER: dealership
      POSTGRES_PASSWORD: dealership
    ports:
      - "15432:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealership -d dealership_order"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage-db:
    image: postgres:15-alpine
    container_name: dealership-storage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dealership_storage
      POSTGRES_USER: dealership
      POSTGRES_PASSWORD: dealership
    ports:
      - "15433:5432"
    volumes:
      - storage_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealership -d dealership_storage"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dealership-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: dealership-keycloak
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import

  order-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dealership-order-service
    restart: unless-stopped
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: order-service
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/dealership_order
      SPRING_DATASOURCE_USERNAME: dealership
      SPRING_DATASOURCE_PASSWORD: dealership
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://192.168.56.1:8081/realms/dealership
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      APP_GRPC_STORAGE_TARGET: storage-service:9090
      APP_GRPC_TIMEOUT_MS: 2000
    ports:
      - "8080:8080"

  storage-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dealership-storage-service
    restart: unless-stopped
    depends_on:
      storage-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: storage-service
      SERVER_PORT: 8082
      GRPC_SERVER_PORT: 9090
      SPRING_DATASOURCE_URL: jdbc:postgresql://storage-db:5432/dealership_storage
      SPRING_DATASOURCE_USERNAME: dealership
      SPRING_DATASOURCE_PASSWORD: dealership
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://host.docker.internal:8081/realms/dealership
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    ports:
      - "8082:8082"
      - "9090:9090"

volumes:
  order_postgres_data:
  storage_postgres_data: